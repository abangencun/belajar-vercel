
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Pertamaku</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #2563eb, #7c3aed, #ec4899);
    }

    .card {
      width: 100%;
      max-width: 440px;
      padding: 45px 25px;
      border-radius: 28px;
      background: white;
      text-align: center;
      box-shadow: 0 20px 60px #00000030;
    }

    .icon {
      font-size: 65px;
      margin-bottom: 15px;
    }

    h1 {
      color: #172554;
      font-size: 32px;
      margin: 10px 0;
    }

    p {
      color: #64748b;
      line-height: 1.8;
    }

    button {
      margin-top: 20px;
      padding: 15px 28px;
      border: none;
      border-radius: 14px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.97);
    }

    footer {
      margin-top: 30px;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="icon">🚀</div>

    <h1>Halo, Kreator!</h1>

    <p>
      Selamat datang di website pertamaku.
      Saya sedang belajar membuat website
      menggunakan AI, GitHub, dan Vercel.
    </p>

    <button onclick="showMessage()">
      Klik untuk mencoba
    </button>

    <footer>
      CREATED WITH PASSION ❤️
    </footer>
  </main>

  <script>
    function showMessage() {
      alert("Hebat! Website saya sudah interaktif!");
    }
  </script>
</body>
</html>
