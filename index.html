
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Pertamaku</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #dbeafe, #fef3c7);
      color: #172554;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    .card {
      background: white;
      padding: 40px 24px;
      border-radius: 24px;
      max-width: 450px;
      width: 100%;
      box-shadow: 0 12px 35px #00000015;
    }

    h1 {
      font-size: 32px;
    }

    p {
      line-height: 1.7;
      color: #475569;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 14px 25px;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Halo, Dunia! 👋</h1>
    <p>
      Ini adalah website pertamaku.
      Dibuat menggunakan GitHub
      dan akan dipublikasikan melalui Vercel.
    </p>
    <button onclick="alert('Website berhasil berjalan!')">
      Klik Saya
    </button>
  </div>
</body>
</html>
